<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05070f" />
    <!-- サプライズなので検索結果には出さない -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARCADE" />
    <title>GAME CENTER 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070f;
        --panel: rgba(10, 15, 32, 0.82);
        --panel-solid: #0c1226;
        --line: rgba(56, 242, 255, 0.28);
        --cyan: #38f2ff;
        --pink: #ff3fa4;
        --gold: #ffd23f;
        --green: #2ee6a8;
        --blue: #3d7dff;
        --text: #e8eeff;
        --muted: #8b99c4;
        --ui: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --display: Impact, "Arial Black", var(--ui);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
        /* タッチ端末対策。ダブルタップ拡大・引っぱって更新・長押しメニュー・
           テキスト選択を止め、連打してもゲームだけが反応するようにする */
        touch-action: manipulation;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        /* iOS Safari はツールバーがページに重なるので、実際に見えている高さを使う
           （--app-height は main.ts が visualViewport から入れる） */
        height: var(--app-height, 100%);
        /* ノッチやホームバーに操作系が隠れないようにするための余白 */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      #stage { position: absolute; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }

      /* ---------------------------------------------------------- HUD */

      #hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        gap: clamp(12px, 2vw, 34px);
        padding: calc(clamp(10px, 1.4vh, 18px) + var(--safe-top, 0px))
          calc(clamp(16px, 2.2vw, 40px) + var(--safe-right, 0px)) clamp(10px, 1.4vh, 18px)
          calc(clamp(16px, 2.2vw, 40px) + var(--safe-left, 0px));
        background: linear-gradient(180deg, rgba(5, 7, 15, 0.92) 0%, rgba(5, 7, 15, 0) 100%);
        pointer-events: none;
        z-index: 10;
      }
      #hud > * { pointer-events: auto; }

      .logo {
        font-family: var(--display);
        font-size: clamp(20px, 2.1vw, 34px);
        letter-spacing: 0.04em;
        text-shadow: 0 0 18px rgba(56, 242, 255, 0.85);
        white-space: nowrap;
      }
      .logo span { color: var(--cyan); }

      .hud-block { display: flex; flex-direction: column; gap: 3px; }
      .hud-label {
        font-family: var(--display);
        font-size: clamp(10px, 0.75vw, 13px);
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      .hud-value {
        font-family: var(--display);
        font-size: clamp(18px, 1.7vw, 28px);
        letter-spacing: 0.02em;
        line-height: 1;
      }
      /* 残り時間。数字が大きいほうが焦る */
      .hud-value.time {
        font-size: clamp(24px, 2.3vw, 40px);
        color: var(--cyan);
        text-shadow: 0 0 18px rgba(56, 242, 255, 0.7);
        font-variant-numeric: tabular-nums;
      }
      .hud-value.time.warn {
        color: #ff5fa2;
        text-shadow: 0 0 22px rgba(255, 63, 164, 0.9);
        animation: time-warn 1s steps(2, end) infinite;
      }
      @keyframes time-warn {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .hud-value.score { color: var(--cyan); text-shadow: 0 0 14px rgba(56, 242, 255, 0.7); }
      .hud-value.plays { color: var(--gold); }
      .hud-value.best { color: var(--muted); font-size: clamp(14px, 1.1vw, 19px); }

      /* 金魚すくい：ポイの紙の残り */
      .hud-value.gauge-value { color: var(--green); text-shadow: 0 0 14px rgba(46, 230, 168, 0.6); }
      .hud-value.gauge-value.warn {
        color: #ff5fa2;
        text-shadow: 0 0 18px rgba(255, 63, 164, 0.8);
        animation: time-warn 1s steps(2, end) infinite;
      }
      .gauge-bar {
        width: clamp(110px, 10vw, 170px);
        height: 9px;
        margin-top: 5px;
        border-radius: 6px;
        background: #263053;
        overflow: hidden;
      }
      .gauge-bar i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--green), var(--cyan));
        transition: width 0.25s;
      }
      .gauge-bar.warn i {
        background: linear-gradient(90deg, #ff3fa4, #ff7bbd);
        animation: time-warn 1s steps(2, end) infinite;
      }

      .pips { display: flex; gap: 6px; margin-top: 4px; }
      .pip {
        width: clamp(9px, 0.7vw, 13px);
        height: clamp(9px, 0.7vw, 13px);
        border-radius: 50%;
        background: #263053;
        transition: background 0.25s, box-shadow 0.25s;
      }
      .pip.on { background: var(--gold); box-shadow: 0 0 10px rgba(255, 210, 63, 0.85); }

      .spacer { flex: 1; }

      .icon-button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--cyan);
        border-radius: 10px;
        padding: 7px 13px;
        font-size: clamp(12px, 0.9vw, 15px);
        cursor: pointer;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
      }
      .icon-button:hover { background: rgba(56, 242, 255, 0.14); }
      .icon-button.off { color: #5d6a92; border-color: rgba(120, 135, 180, 0.25); }

      /* ------------------------------------------------------ Controls */

      #controls {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: clamp(12px, 2vw, 32px);
        padding: clamp(12px, 2vh, 26px)
          calc(clamp(16px, 2.4vw, 44px) + var(--safe-right, 0px))
          calc(clamp(12px, 2vh, 26px) + var(--safe-bottom, 0px))
          calc(clamp(16px, 2.4vw, 44px) + var(--safe-left, 0px));
        background: linear-gradient(0deg, rgba(5, 7, 15, 0.94) 15%, rgba(5, 7, 15, 0) 100%);
        pointer-events: none;
        z-index: 10;
      }
      #controls > * { pointer-events: auto; }

      .view-switch {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 12px;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .view-switch .caption {
        font-size: clamp(10px, 0.75vw, 12px);
        letter-spacing: 0.16em;
        color: var(--muted);
        text-align: center;
      }
      .view-buttons { display: flex; gap: 6px; }
      .view-button {
        min-width: clamp(46px, 4vw, 62px);
        padding: 8px 4px;
        border-radius: 9px;
        border: 1px solid rgba(120, 135, 180, 0.3);
        background: rgba(18, 25, 48, 0.9);
        color: var(--muted);
        font-size: clamp(12px, 0.95vw, 15px);
        cursor: pointer;
        transition: all 0.18s;
      }
      .view-button:hover { border-color: var(--line); color: var(--text); }
      .view-button.active {
        background: linear-gradient(180deg, #2f6bff, #1b3fae);
        border-color: #7ea6ff;
        color: #fff;
        box-shadow: 0 0 16px rgba(61, 125, 255, 0.55);
      }
      .view-hint {
        font-size: clamp(10px, 0.72vw, 12px);
        color: #5f6d99;
        text-align: center;
      }

      .dpad {
        display: grid;
        grid-template-columns: repeat(3, auto);
        grid-template-rows: repeat(3, auto);
        gap: 6px;
        align-items: center;
        justify-items: center;
      }
      .pad-button {
        width: clamp(48px, 4.4vw, 66px);
        height: clamp(48px, 4.4vw, 66px);
        border-radius: 14px;
        border: 1px solid rgba(126, 166, 255, 0.42);
        background: linear-gradient(180deg, #3f7bff 0%, #1f3f96 55%, #16295e 100%);
        color: #fff;
        font-size: clamp(16px, 1.4vw, 22px);
        cursor: pointer;
        box-shadow: 0 5px 0 #0e1a3d, 0 0 18px rgba(61, 125, 255, 0.28);
        transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      .pad-button:hover { filter: brightness(1.15); }
      .pad-button.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #0e1a3d; filter: brightness(0.9); }
      .pad-center {
        font-size: clamp(10px, 0.78vw, 13px);
        color: var(--muted);
        letter-spacing: 0.1em;
        text-align: center;
      }

      .catch-area { display: flex; align-items: center; gap: clamp(10px, 1.4vw, 22px); }
      .catch-button {
        min-width: clamp(180px, 17vw, 300px);
        padding: clamp(14px, 1.5vh, 22px) clamp(20px, 2vw, 34px);
        border-radius: 18px;
        border: 1px solid rgba(255, 138, 200, 0.55);
        background: linear-gradient(180deg, #ff62b6 0%, #d4187a 52%, #8d0f4f 100%);
        color: #fff;
        font-family: var(--display);
        font-size: clamp(24px, 2.4vw, 40px);
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 7px 0 #4d0a2c, 0 0 30px rgba(255, 63, 164, 0.35);
        transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      .catch-button small {
        display: block;
        font-family: var(--ui);
        font-size: clamp(10px, 0.8vw, 13px);
        letter-spacing: 0.2em;
        opacity: 0.75;
        margin-top: 3px;
      }
      .catch-button:hover { filter: brightness(1.1); }
      .catch-button.pressed { transform: translateY(5px); box-shadow: 0 2px 0 #4d0a2c; }

      /* 射的の SHOOT はオレンジ、金魚すくいの SCOOP は水色 */
      .catch-button.shoot {
        border-color: rgba(255, 200, 140, 0.55);
        background: linear-gradient(180deg, #ffb347 0%, #e8641a 52%, #8f3a0a 100%);
        box-shadow: 0 7px 0 #4d1f06, 0 0 30px rgba(255, 140, 60, 0.35);
      }
      .catch-button.shoot.pressed { box-shadow: 0 2px 0 #4d1f06; }
      .catch-button.scoop {
        border-color: rgba(160, 225, 255, 0.55);
        background: linear-gradient(180deg, #5fd8ff 0%, #1e8fd6 52%, #0d4f86 100%);
        box-shadow: 0 7px 0 #062a4d, 0 0 30px rgba(56, 242, 255, 0.35);
      }
      .catch-button.scoop.pressed { box-shadow: 0 2px 0 #062a4d; }
      .catch-button:disabled, .pad-button:disabled, .view-button:disabled {
        opacity: 0.4;
        cursor: default;
        filter: grayscale(0.5);
      }

      .status {
        min-width: clamp(90px, 9vw, 150px);
        font-size: clamp(13px, 1vw, 18px);
        color: var(--gold);
        line-height: 1.5;
        white-space: pre-line;
      }

      /* ------------------------------------------------------ Overlays */

      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
      }
      #overlay.show { display: flex; }
      #overlay.pass { pointer-events: none; }
      #overlay .veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(5, 8, 20, 0.72) 0%, rgba(3, 5, 12, 0.93) 70%);
        animation: fade-in 0.28s ease both;
      }
      #overlay .veil.clear { background: none; }

      .card {
        position: relative;
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: clamp(24px, 3.4vh, 46px) clamp(28px, 3.6vw, 62px);
        text-align: center;
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.6), 0 0 60px rgba(56, 242, 255, 0.08);
        animation: pop-in 0.34s cubic-bezier(0.2, 1.3, 0.5, 1) both;
        max-width: min(94vw, 900px);
        max-height: 92vh;
        overflow-y: auto;
      }
      .card.plain { background: none; border: none; box-shadow: none; }

      .title-main {
        font-family: var(--display);
        font-size: clamp(46px, 7.6vw, 128px);
        line-height: 1;
        letter-spacing: 0.02em;
        text-shadow: 0 0 42px rgba(56, 242, 255, 0.9);
      }
      .title-sub {
        margin-top: clamp(10px, 1.6vh, 20px);
        font-size: clamp(18px, 2.2vw, 36px);
        color: #ff8ac6;
        text-shadow: 0 0 22px rgba(255, 63, 164, 0.7);
      }
      .title-badge {
        display: inline-block;
        margin-top: 12px;
        padding: 5px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: clamp(11px, 0.9vw, 14px);
        letter-spacing: 0.24em;
        color: var(--cyan);
      }

      .headline {
        font-family: var(--display);
        font-size: clamp(34px, 5vw, 84px);
        line-height: 1.05;
      }
      .headline.get { color: var(--gold); text-shadow: 0 0 34px rgba(255, 138, 31, 0.9); }
      .headline.over { text-shadow: 0 0 30px rgba(255, 63, 164, 0.8); }
      .headline.miss { color: #ff7bbd; text-shadow: 0 0 24px rgba(255, 63, 164, 0.7); }

      .subline { margin-top: 14px; font-size: clamp(15px, 1.5vw, 26px); color: #cdd6f0; }

      /* ------------------------------------------------- モード選択 */

      .mode-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 28px;
        /* カードのパディングの内側に収める（vw 基準だとはみ出す） */
        width: 100%;
        max-width: 560px;
      }
      .mode-card {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 18px 22px;
        border-radius: 18px;
        border: 1px solid rgba(126, 166, 255, 0.4);
        background: linear-gradient(180deg, rgba(31, 46, 96, 0.92), rgba(16, 24, 52, 0.92));
        color: var(--text);
        text-align: left;
        cursor: pointer;
        box-shadow: 0 6px 0 #0e1a3d, 0 0 24px rgba(61, 125, 255, 0.2);
        transition: transform 0.12s, box-shadow 0.12s, border-color 0.2s;
      }
      .mode-card:hover, .mode-card:focus-visible {
        border-color: var(--cyan);
        transform: translateY(-2px);
        box-shadow: 0 8px 0 #0e1a3d, 0 0 32px rgba(56, 242, 255, 0.35);
      }
      .mode-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #0e1a3d; }
      .mode-badge {
        flex: none;
        width: 52px; height: 52px;
        display: grid; place-items: center;
        border-radius: 14px;
        background: rgba(5, 9, 22, 0.75);
        font-size: 26px;
      }
      .mode-body { flex: 1; min-width: 0; }
      .mode-label {
        font-family: var(--display);
        font-size: clamp(22px, 2.2vw, 32px);
        letter-spacing: 0.04em;
      }
      .mode-caption { margin-top: 4px; font-size: clamp(13px, 1.1vw, 17px); color: var(--muted); }
      .mode-best {
        flex: none;
        font-family: var(--display);
        font-size: clamp(13px, 1.1vw, 17px);
        color: var(--gold);
        letter-spacing: 0.06em;
      }
      /* リザルトで「どのモードの記録か」を示す */
      .mode-tag {
        margin-top: 8px;
        font-size: clamp(12px, 1vw, 16px);
        letter-spacing: 0.16em;
        color: var(--muted);
      }
      .points {
        margin-top: 16px;
        font-family: var(--display);
        font-size: clamp(28px, 3.4vw, 58px);
        color: var(--cyan);
        text-shadow: 0 0 24px rgba(56, 242, 255, 0.8);
      }

      .stat-row {
        display: flex;
        gap: clamp(20px, 4vw, 70px);
        justify-content: center;
        margin: clamp(18px, 2.6vh, 34px) 0;
      }
      .stat { min-width: 130px; }
      .stat .k {
        font-family: var(--display);
        font-size: clamp(11px, 0.9vw, 15px);
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      .stat .v {
        font-family: var(--display);
        font-size: clamp(30px, 3.4vw, 58px);
        line-height: 1.1;
      }
      .stat .v.cyan { color: var(--cyan); text-shadow: 0 0 20px rgba(56, 242, 255, 0.7); }
      .stat .v.green { color: var(--green); text-shadow: 0 0 20px rgba(46, 230, 168, 0.6); }
      .stat .v.gold { color: var(--gold); text-shadow: 0 0 20px rgba(255, 210, 63, 0.7); }
      .stat .v.pink { color: #ff7bbd; text-shadow: 0 0 20px rgba(255, 63, 164, 0.6); }

      .record {
        font-family: var(--display);
        font-size: clamp(22px, 2.4vw, 40px);
        color: var(--gold);
        text-shadow: 0 0 24px rgba(255, 138, 31, 0.85);
        animation: throb 1.2s ease-in-out infinite;
      }

      .button-row {
        display: flex;
        gap: clamp(12px, 1.6vw, 26px);
        justify-content: center;
        margin-top: clamp(20px, 2.8vh, 38px);
        flex-wrap: wrap;
      }

      .btn {
        min-width: clamp(150px, 15vw, 260px);
        padding: clamp(12px, 1.5vh, 20px) clamp(18px, 2vw, 32px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-family: var(--display);
        font-size: clamp(18px, 1.9vw, 32px);
        letter-spacing: 0.05em;
        color: #fff;
        cursor: pointer;
        transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
      }
      .btn:hover { filter: brightness(1.12); }
      .btn:active { transform: translateY(4px); }
      .btn small {
        display: block;
        font-family: var(--ui);
        font-size: clamp(10px, 0.78vw, 13px);
        letter-spacing: 0.18em;
        opacity: 0.7;
        margin-top: 3px;
      }
      .btn.green { background: linear-gradient(180deg, #47f5bb 0%, #14a476 55%, #0a6b4d 100%); box-shadow: 0 6px 0 #064031; }
      .btn.blue  { background: linear-gradient(180deg, #5b93ff 0%, #2a52c4 55%, #17307a 100%); box-shadow: 0 6px 0 #0d1d4d; }
      .btn.pink  { background: linear-gradient(180deg, #ff62b6 0%, #d4187a 55%, #8d0f4f 100%); box-shadow: 0 6px 0 #4d0a2c; }

      .howto { text-align: left; margin-top: 8px; }
      .howto h3 {
        font-size: clamp(15px, 1.3vw, 22px);
        color: var(--cyan);
        margin: 18px 0 8px;
        letter-spacing: 0.05em;
      }
      .howto p, .howto li {
        font-size: clamp(13px, 1.05vw, 18px);
        line-height: 1.75;
        color: #ccd5ee;
      }
      .howto ul { padding-left: 1.3em; }
      .howto kbd {
        display: inline-block;
        padding: 1px 8px;
        margin: 0 2px;
        border-radius: 6px;
        border: 1px solid rgba(140, 160, 210, 0.4);
        background: #172040;
        font-family: var(--ui);
        font-size: 0.9em;
        color: #dce4ff;
      }

      /* ------------------------------------------------ 誕生日サプライズ */

      .card.birthday { max-width: min(94vw, 760px); }

      .birthday-headline {
        font-family: var(--display);
        font-size: clamp(38px, 5.6vw, 92px);
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: var(--gold);
        text-shadow: 0 0 34px rgba(255, 138, 31, 0.9), 0 0 70px rgba(255, 95, 162, 0.5);
        animation: throb 1.6s ease-in-out infinite;
      }
      .birthday-name {
        margin-top: 10px;
        font-size: clamp(20px, 2.4vw, 38px);
        color: #ff9ecb;
        text-shadow: 0 0 20px rgba(255, 63, 164, 0.7);
        letter-spacing: 0.08em;
      }
      .birthday-prize {
        width: clamp(130px, 16vw, 220px);
        height: auto;
        margin: clamp(10px, 1.6vh, 22px) auto 0;
        display: block;
        filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 26px rgba(255, 215, 107, 0.55));
        animation: float-soft 3s ease-in-out infinite;
      }
      .birthday-message {
        margin-top: clamp(12px, 2vh, 24px);
        font-size: clamp(15px, 1.5vw, 25px);
        line-height: 2;
        color: #eaf0ff;
      }
      .birthday-message p { margin: 0; }
      .birthday-closing {
        margin-top: clamp(14px, 2.2vh, 26px);
        font-size: clamp(17px, 1.9vw, 30px);
        color: var(--gold);
        letter-spacing: 0.06em;
        text-shadow: 0 0 22px rgba(255, 210, 63, 0.65);
      }

      @keyframes float-soft {
        0%, 100% { transform: translateY(-5px); }
        50% { transform: translateY(6px); }
      }

      /* 紙吹雪 */
      .confetti {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 40;
      }
      .confetti i {
        position: absolute;
        top: -8vh;
        width: 10px;
        height: 16px;
        opacity: 0.95;
        animation-name: confetti-fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes confetti-fall {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(115vh) rotate(720deg); }
      }

      /* 獲得した景品の一覧（＝実物で渡すもの） */
      .won-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: clamp(10px, 1.6vh, 20px);
      }
      .won-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px 7px 7px;
        border-radius: 999px;
        border: 1px solid rgba(140, 160, 210, 0.32);
        background: rgba(18, 25, 48, 0.9);
        font-size: clamp(13px, 1.1vw, 18px);
        color: #dfe6fb;
      }
      .won-chip img { width: clamp(30px, 2.6vw, 44px); height: auto; }
      .won-chip .swatch {
        width: clamp(22px, 2vw, 30px);
        height: clamp(22px, 2vw, 30px);
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4) inset;
      }
      .won-chip b { color: var(--cyan); font-size: 0.92em; }
      .won-chip.main {
        border-color: rgba(255, 210, 63, 0.7);
        background: linear-gradient(180deg, rgba(90, 62, 20, 0.9), rgba(40, 28, 12, 0.9));
        color: var(--gold);
        box-shadow: 0 0 22px rgba(255, 210, 63, 0.28);
      }

      #toast {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
        display: none;
      }
      #toast.show { display: block; animation: pop-in 0.24s cubic-bezier(0.2, 1.3, 0.5, 1) both; }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: var(--bg);
        z-index: 100;
        transition: opacity 0.45s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .ring {
        width: 46px; height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(56, 242, 255, 0.2);
        border-top-color: var(--cyan);
        animation: spin 0.9s linear infinite;
      }
      #boot .text { letter-spacing: 0.32em; font-size: 13px; color: var(--muted); }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.86); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes throb {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      /* ------------------------------------------ タブレット / スマホ */

      /* 指で押す前提の端末では、どのボタンも指の腹より大きくする */
      @media (pointer: coarse) {
        .pad-button { width: 76px; height: 76px; font-size: 26px; border-radius: 18px; }
        .catch-button { min-width: 200px; font-size: 34px; }
        .view-button { min-width: 64px; padding: 13px 6px; font-size: 15px; }
        .icon-button { padding: 12px 16px; font-size: 15px; }
        .btn { min-width: 200px; padding: 18px 28px; }
        /* キー操作の案内はタッチ端末では意味がない */
        .view-hint { display: none; }
        .catch-button small, .btn small { display: none; }
      }

      /* 縦画面（スマホ / タブレットの縦持ち）。
         視点切替を上段に、十字キーと CATCH を下段の左右に置く */
      @media (max-aspect-ratio: 1 / 1) {
        #controls {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          grid-template-areas: "view view" "dpad catch";
          align-items: center;
          gap: 12px;
        }
        .view-switch {
          grid-area: view;
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 8px 10px;
        }
        .view-switch .caption { display: none; }
        .view-buttons { flex: 1; justify-content: center; }
        .view-button { flex: 1; }
        .dpad { grid-area: dpad; }
        .catch-area {
          grid-area: catch;
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .catch-button { min-width: 0; width: 100%; }
        .status { min-width: 0; text-align: center; }
        #hud { gap: 12px; }
      }

      /* スマホの縦持ちは横幅が足りないので、十字キーを詰めて CATCH に幅を譲る */
      @media (max-aspect-ratio: 1 / 1) and (max-width: 500px) {
        .pad-button { width: 60px; height: 60px; font-size: 21px; border-radius: 15px; }
        .dpad { gap: 5px; }
        .catch-button { font-size: 26px; padding: 16px 8px; }
        .pad-center { font-size: 10px; }
      }

      /* 狭い画面ではモードカードを詰める */
      @media (max-width: 620px) {
        .mode-card { padding: 14px 16px; gap: 12px; }
        .mode-badge { width: 44px; height: 44px; font-size: 22px; }
        .mode-best { display: none; }
      }

      /* 横幅が足りない端末では HUD を削る（残すのは PLAY と SCORE） */
      @media (max-width: 620px) {
        .logo span { display: none; }
        .pips { display: none; }
        .hud-block.best { display: none; }
        .status { display: none; }
      }

      /* 画面が低いときは操作パネルを詰める */
      @media (max-height: 720px) {
        .view-switch .caption, .view-hint { display: none; }
        .catch-button small { display: none; }
      }

      /* スマホの横持ち。高さが足りないので操作系を一段小さくし、
         さらに左右の端へ寄せて、画面中央（＝筐体）を空ける */
      /* 低い横画面では選択肢を横並びにする（3 択だと縦には収まらない） */
      @media (max-height: 560px) {
        .card { padding: 14px 18px; }
        .mode-list { flex-direction: row; width: 100%; max-width: 860px; gap: 10px; margin-top: 14px; }
        .mode-card {
          /* 行並びでは等分に縮める（既定の width:100% のままだと 3 枚ではみ出す） */
          width: auto;
          flex: 1 1 0;
          min-width: 0;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 8px;
          padding: 12px 10px;
        }
        .mode-caption { overflow-wrap: anywhere; }
        .mode-badge { width: 38px; height: 38px; font-size: 19px; }
        .mode-label { font-size: clamp(16px, 2.4vw, 22px); }
        .mode-caption { font-size: clamp(10px, 1.4vw, 13px); }
        .mode-best { font-size: 11px; }
      }

      @media (max-height: 560px) and (min-aspect-ratio: 3 / 2) {
        #controls {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr) auto;
          grid-template-rows: auto auto;
          grid-template-areas:
            "dpad . view"
            "dpad . catch";
          align-items: end;
          justify-items: end;
          gap: 8px;
          /* 中央は筐体のために空けるので、下端の暗い帯もいらない */
          background: none;
        }
        .dpad { grid-area: dpad; align-self: end; }
        .view-switch { grid-area: view; }
        .catch-area { grid-area: catch; }
      }

      /* スマホの横持ち。高さが足りないので操作系を一段小さくして、
         筐体が見える帯をできるだけ広く残す */
      @media (max-height: 560px) {
        #controls { padding-top: 6px; gap: 10px; }
        .pad-button { width: 52px; height: 52px; font-size: 18px; border-radius: 13px; }
        .dpad { gap: 4px; }
        .pad-center { font-size: 10px; }
        .catch-button { min-width: 150px; font-size: 24px; padding: 12px 18px; }
        .view-switch { padding: 6px 8px; }
        .view-button { min-width: 52px; padding: 8px 4px; font-size: 13px; }
        .status { display: none; }
        #hud { padding-top: 6px; padding-bottom: 6px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-tokeH8Ci.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud"></div>
      <div id="toast"></div>
      <div id="controls"></div>
      <div id="overlay"></div>
    </div>
    <div id="boot">
      <div class="ring"></div>
      <div class="text">LOADING</div>
    </div>
  </body>
</html>
